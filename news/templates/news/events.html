{% extends "news/base.html" %}
{% block content %}

<div class="calendar-section">
    <div class="chess-card">
        <div class="card-header-chess">
            <div class="header-left">
                <h3>Event Calendar</h3>
            </div>
        </div>
        <div class="card-body-chess">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<!-- Tooltip Definition - MOVED TO TOP SO IT EXISTS WHEN JS RUNS -->
<div id="eventTooltip" class="event-tooltip"></div>

<div id="eventModal" class="modal-chess-overlay">
    <div class="modal-chess-container">
        <div class="modal-chess-header">
            <div class="modal-title">
                <i class="fas fa-chess-queen"></i>
                <h4>Create New Event</h4>
            </div>
            <button class="modal-chess-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-chess-body">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

            <div class="chess-input-group">
                <label>
                    <i class="fas fa-chess-pawn"></i>
                    Event Title
                </label>
                <input type="text" id="eventTitle" placeholder="e.g., Magnus vs Hikaru">
            </div>

            <div class="chess-input-group">
                <label>
                    <i class="fas fa-align-left"></i>
                    Description
                </label>
                <textarea id="eventDesc" placeholder="Add event details..."></textarea>
            </div>

            <div class="datetime-grid">
                <div class="chess-input-group">
                    <label>
                        <i class="fas fa-hourglass-start"></i>
                        Start Time
                    </label>
                    <input type="datetime-local" id="eventStart" class="datetime-input">
                </div>
                <div class="chess-input-group">
                    <label>
                        <i class="fas fa-hourglass-end"></i>
                        End Time
                    </label>
                    <input type="datetime-local" id="eventEnd" class="datetime-input">
                </div>
            </div>
        </div>

        <div class="modal-chess-footer">
            <button class="btn-chess-secondary" onclick="closeModal()">
                <i class="fas fa-times-circle"></i>
                Cancel
            </button>
            <button class="btn-chess-success" onclick="saveEvent()">
                <i class="fas fa-check-circle"></i>
                Save Event
            </button>
        </div>
    </div>
</div>

<script>
    let selectedDate = null;

    document.addEventListener('DOMContentLoaded', function () {
        window.calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',

            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },

            events: '/events/',

            dateClick: function (info) {
                setTimeout(() => {
                    selectedDate = info.dateStr;
                    document.getElementById("eventStart").value = info.dateStr + "T00:00";
                    document.getElementById("eventEnd").value = info.dateStr + "T23:59";
                    document.getElementById("eventModal").style.display = "flex";
                }, 10);
            },

            eventClick: function (info) {
                // Get tooltip element
                let tooltip = document.getElementById("eventTooltip");

                // Format description
                let description = info.event.extendedProps.description || "No description available";
                let startTime = info.event.start ? new Date(info.event.start).toLocaleString([], { hour: 'numeric', minute: '2-digit' }) : "Not set";
                let endTime = info.event.end ? new Date(info.event.end).toLocaleString([], { hour: 'numeric', minute: '2-digit' }) : "Not set";

                // Set tooltip content with more details
                tooltip.innerHTML = `
                    <div class="tooltip-header">
                        <i class="fas fa-chess-king"></i>
                        <strong>${info.event.title}</strong>
                    </div>
                    <div class="tooltip-time">
                        <div><i class="fas fa-hourglass-start"></i> Start: ${startTime}</div>
                        <div><i class="fas fa-hourglass-end"></i> End: ${endTime}</div>
                    </div>
                `;

                // Position tooltip
                tooltip.style.display = "block";
                tooltip.style.top = (info.jsEvent.pageY + 20) + "px";
                tooltip.style.left = (info.jsEvent.pageX + 20) + "px";

                // Prevent event default
                info.jsEvent.preventDefault();
            },

            // Base color (will be overridden in eventDidMount based on date)
            eventColor: '#779556',
            eventTextColor: '#ffffff',

            eventDidMount: function (info) {
                // Get current date and event end date
                const now = new Date();
                const eventEnd = info.event.end;

                // Base styles for all events
                info.el.style.border = 'none';
                info.el.style.borderRadius = '4px';
                info.el.style.padding = '2px 6px';
                info.el.style.fontSize = '0.85rem';
                info.el.style.fontWeight = '600';
                info.el.style.color = '#ffffff';
                info.el.style.borderLeft = '3px solid #ebecd0';
                info.el.style.cursor = 'pointer';

                // Apply different styling based on whether event has passed
                if (eventEnd && eventEnd < now) {
                    // Past event - grayed out
                    info.el.classList.add('fc-event-past');
                } else if (eventEnd && eventEnd >= now) {
                    info.el.classList.add('fc-event-present');
                    // Current/future event - normal chess green
                    // info.el.style.backgroundColor = '#779556';
                    // info.el.style.boxShadow = '0 2px 4px rgba(119, 149, 86, 0.3)';
                } else {
                    // No end date - treat as present/future
                    info.el.classList.add('fc-event-future');
                }
            }
        });
        calendar.render();
    });

    // Global click handler to hide tooltip when clicking elsewhere
    document.addEventListener('click', function (e) {
        let tooltip = document.getElementById("eventTooltip");
        let isClickOnEvent = e.target.closest('.fc-event');
        if (!isClickOnEvent && tooltip.style.display === "block") {
            tooltip.style.display = "none";
        }
    });

    // Hide tooltip on escape key
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            let tooltip = document.getElementById("eventTooltip");
            tooltip.style.display = "none";
        }
    });

    function closeModal() {
        document.getElementById("eventModal").style.display = "none";
        // Clear form
        document.getElementById("eventTitle").value = '';
        document.getElementById("eventDesc").value = '';
    }

    function saveEvent() {
        fetch("/add-event/", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                title: document.getElementById("eventTitle").value,
                description: document.getElementById("eventDesc").value,
                start: document.getElementById("eventStart").value,
                end: document.getElementById("eventEnd").value
            })
        })
            .then(res => res.json())
            .then(data => {
                closeModal();
                calendar.refetchEvents();

                const toast = document.createElement('div');
                toast.className = 'chess-toast';
                toast.innerHTML = '<i class="fas fa-check-circle"></i> Event saved successfully!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }
</script>
