{% extends 'news/base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'chessboardjs-1.0.0/css/chessboard-1.0.0.min.css' %}">
<script src="{% static 'jquery.min.js' %}"></script>
<script src="{% static 'chessboardjs-1.0.0/js/chessboard-1.0.0.min.js' %}"></script>
<script src="{% static 'chess.min.js' %}"></script>

<audio id="moveSound">    <source src="{% static 'sound/move-self.mp3' %}"  type="audio/mpeg"></audio>
<audio id="captureSound"> <source src="{% static 'sound/capture.mp3' %}"    type="audio/mpeg"></audio>
<audio id="checkSound">   <source src="{% static 'sound/move-check.mp3' %}" type="audio/mpeg"></audio>

<style>
  /* ── Layout ─────────────────────────────────────────────── */
  .game-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1400px;
    margin: 16px auto;
    padding: 0 16px;
    align-items: start;
  }

  .board-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }

  /* Players */
  .player-label {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--chess-light);
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .player-avatar {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid var(--border);
    font-size: 15px;
    overflow: hidden;
  }

  .avatar-black {
    background: linear-gradient(135deg, #2c2c2c, #101010);
    color: #b8b8b8;
  }

  .avatar-white {
    background: linear-gradient(135deg, #f5f5f5, #d6d6d6);
    color: #2a2a2a;
  }

  .player-color-dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
  }

  .dot-black { background: #1a1a1a; }
  .dot-white { background: #f0f0f0; }

  .board-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
    width: 100%;
  }

  .eval-track {
    width: 26px;
    flex-shrink: 0;
    background: #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  #white-bar {
    width: 100%;
    background: #f0f0f0;
    position: absolute; bottom: 0; left: 0;
    height: 50%;
    transition: height 0.35s ease;
    display: flex; align-items: flex-end; justify-content: center;
    font-size: 10px; font-weight: 800; color: #000;
    padding-bottom: 5px;
    box-sizing: border-box;
    writing-mode: horizontal-tb;
  }

  #black-bar {
    width: 100%;
    background: #1a1a1a;
    position: absolute; top: 0; left: 0;
    height: 50%;
    transition: height 0.35s ease;
    display: flex; align-items: flex-start; justify-content: center;
    font-size: 10px; font-weight: 800; color: #fff;
    padding-top: 5px;
    box-sizing: border-box;
  }

  .eval-track.flipped #white-bar {
    top: 0; bottom: auto;
    align-items: flex-start;
    padding-top: 5px;
    padding-bottom: 0;
  }

  .eval-track.flipped #black-bar {
    bottom: 0; top: auto;
    align-items: flex-end;
    padding-bottom: 5px;
    padding-top: 0;
  }

  .board-wrapper {
    position: relative;
    flex-shrink: 0;
  }

  #game-board { outline: none; }

  #game-board .white-1e1d7 { background-color: #eeeed2 !important; }
  #game-board .black-3c85d { background-color: #7A2F22 !important; }

  #board-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .arrow-hint {
    font-size: 0.63rem;
    font-weight: 600;
    color: var(--color-gray-400);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 2px 0;
  }

  .board-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 10px;
  }

  .notation-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .notation-header .section-label { margin-bottom: 0; }

  .flip-icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid rgba(245,158,11,0.3);
    background: var(--card-color);
    color: #f59e0b;
    cursor: pointer;
    font-size: 0.92rem;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }

  .flip-icon-btn:hover { background: rgba(245,158,11,0.1); border-color: #f59e0b; }
  .flip-icon-btn:focus { outline: none; box-shadow: none; }

  .moves-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .moves-row #moves-list { flex: 1; min-width: 0; }

  .mobile-nav-arrow {
    display: none;
    flex-shrink: 0;
    width: 30px; height: 30px;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-color);
    color: var(--chess-secondary);
    cursor: pointer;
    font-size: 1rem;
  }

  .mobile-nav-arrow:hover { background: oklch(24% 0.015 256); color: var(--chess-light); }
  .mobile-nav-arrow:focus { outline: none; box-shadow: none; }

  .ctrl-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-color);
    color: var(--chess-secondary);
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.15s ease;
  }

  .ctrl-btn:hover { border-color: var(--chess-primary); color: var(--chess-light); background: oklch(24% 0.015 256); }
  .ctrl-btn:focus { outline: none; box-shadow: none; }

  .ctrl-btn.c-next  { border-color: rgba(119,149,86,0.4);  color: var(--chess-primary); }
  .ctrl-btn.c-prev  { border-color: rgba(96,165,250,0.3);  color: #60a5fa; }
  .ctrl-btn.c-reset { border-color: rgba(200,75,75,0.3);   color: var(--chess-red); }
  .ctrl-btn.c-flip  { border-color: rgba(245,158,11,0.3);  color: #f59e0b; }
  .ctrl-btn.c-next:hover  { background: rgba(119,149,86,0.12); }
  .ctrl-btn.c-prev:hover  { background: rgba(96,165,250,0.08); }
  .ctrl-btn.c-reset:hover { background: rgba(200,75,75,0.08); }
  .ctrl-btn.c-flip:hover  { background: rgba(245,158,11,0.08); }

  .info-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    width: 100%;
  }

  .section-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--color-gray-400);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .info-panel {
    background: var(--card-color);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .game-title-text {
    font-size: 1rem;
    font-weight: 700;
    color: var(--chess-light);
    margin: 0;
    line-height: 1.3;
    word-break: break-word;
  }

  #moves-list {
    max-height: 260px;
    overflow-y: auto;
    font-size: 0.88rem;
  }

  #moves-list::-webkit-scrollbar { width: 4px; }
  #moves-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  .move-pair-row {
    display: flex;
    align-items: center;
    margin-bottom: 3px;
    border-radius: 6px;
    padding: 1px 2px;
  }

  .move-num {
    color: var(--color-gray-400);
    font-weight: 700;
    font-size: 0.78rem;
    min-width: 30px;
    opacity: 0.7;
  }

  .move-icon {
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--chess-secondary);
    flex: 1;
    transition: all 0.12s ease;
    font-size: 0.88rem;
  }

  .move-icon:hover { background: oklch(26% 0.015 256); color: var(--chess-light); }
  .move-icon.active-move { background: rgba(119,149,86,0.18); color: var(--chess-primary); font-weight: 700; }

  .initial-pos {
    display: block;
    padding: 5px 8px;
    color: var(--color-gray-400);
    font-size: 0.82rem;
    font-style: italic;
    cursor: pointer;
    border-radius: 6px;
    margin-bottom: 6px;
    transition: all 0.12s;
  }

  .initial-pos:hover { background: oklch(24% 0.01 256); color: var(--chess-light); }
  .initial-pos.active-move { color: var(--chess-primary); font-weight: 700; font-style: normal; background: rgba(119,149,86,0.12); }

  #comments-list { max-height: 150px; overflow-y: auto; font-size: 0.83rem; }
  #comments-list::-webkit-scrollbar { width: 4px; }
  #comments-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  .comment-item { border-bottom: 1px solid var(--border); padding: 7px 0; }
  .comment-item:last-child { border-bottom: none; }
  .comment-user { font-size: 0.78rem; font-weight: 700; color: var(--chess-accent); }
  .comment-move-tag { font-size: 0.68rem; background: oklch(20% 0.01 256); border: 1px solid var(--border); padding: 1px 7px; border-radius: 99px; color: var(--color-gray-400); }
  .comment-text { color: var(--chess-secondary); margin: 4px 0 0; line-height: 1.45; }
  .no-comments { color: var(--color-gray-400); font-size: 0.82rem; text-align: center; padding: 12px 0; font-style: italic; }

  .comment-form-label { font-size: 0.68rem; font-weight: 700; color: var(--color-gray-400); margin-bottom: 6px; display: block; letter-spacing: 1px; text-transform: uppercase; }

  #id_comment {
    width: 100%;
    background: oklch(14% 0.008 256);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--chess-light);
    font-size: 0.86rem;
    padding: 9px 11px;
    resize: vertical;
    font-family: inherit;
    transition: border-color 0.15s;
    outline: none;
    box-sizing: border-box;
  }

  #id_comment:focus { border-color: var(--chess-primary); }
  #id_comment::placeholder { color: var(--color-gray-400); }

  .comment-submit-btn {
    margin-top: 8px;
    padding: 7px 18px;
    font-size: 0.78rem;
    font-weight: 700;
    border-radius: 99px;
    border: none;
    background: var(--chess-primary);
    color: #fff;
    cursor: pointer;
    transition: all 0.18s;
  }

  .comment-submit-btn:hover { background: #67804a; transform: translateY(-1px); }

  .notification-container { position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 320px; }

  .notification {
    background: var(--card-color);
    border: 1px solid var(--border);
    border-left: 4px solid var(--chess-primary);
    color: var(--chess-light);
    padding: 11px 15px;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    margin-bottom: 10px;
    transform: translateX(120%);
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
    position: relative;
  }

  .notification.show  { transform: translateX(0); opacity: 1; }
  .notification.error { border-left-color: var(--chess-red); }
  .notification.info  { border-left-color: #60a5fa; }
  .notification-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .notification-title  { font-weight: 700; font-size: 0.82rem; }
  .notification-close  { background: none; border: none; color: var(--color-gray-400); font-size: 1rem; cursor: pointer; }
  .notification-body   { font-size: 0.8rem; color: var(--chess-secondary); }
  .notification-progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--chess-primary); width: 0%; animation: progressShrink 2.5s linear forwards; }

  @keyframes progressShrink { from { width: 100%; } to { width: 0%; } }

  @media (max-width: 780px) {
    .game-layout { grid-template-columns: 1fr; padding: 12px; gap: 14px; }

    #moves-list {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      max-height: none;
      padding-bottom: 8px;
      gap: 4px;
      scrollbar-width: thin;
    }

    #moves-list::-webkit-scrollbar { height: 4px; width: 0; }

    .move-pair-row {
      flex: 0 0 auto;
      margin-bottom: 0;
      white-space: nowrap;
    }

    .initial-pos {
      flex: 0 0 auto;
      margin-bottom: 0;
      white-space: nowrap;
    }

    .board-controls { display: none; }
    .mobile-nav-arrow { display: flex; }
  }

  @media (max-width: 480px) {
    .eval-track { width: 18px; }
    #white-bar, #black-bar { font-size: 8px; }
    .player-avatar { width: 26px; height: 26px; font-size: 13px; }
  }
</style>

<!-- ══ HTML ═════════════════════════════════════════════════════ -->
<div class="game-layout">

  <div class="board-col">
    <div class="player-label">
      <div class="player-avatar avatar-black" id="black-avatar">
        <i class="bi bi-person-fill"></i>
      </div>
      <span id="black-player-name">{{ game.black_player }}</span>
    </div>
    <div class="board-row">
      <div class="eval-track" id="eval-track">
        <div id="black-bar"></div>
        <div id="white-bar"></div>
      </div>

      <div class="board-wrapper" id="board-wrapper">
        <div id="game-board"></div>
        <svg id="board-overlay" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="ah-green"  markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0,0 L0,5 L5,2.5 z" fill="rgba(0,200,80,0.95)"/></marker>
            <marker id="ah-orange" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0,0 L0,5 L5,2.5 z" fill="rgba(255,165,0,0.95)"/></marker>
            <marker id="ah-red"    markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0,0 L0,5 L5,2.5 z" fill="rgba(220,50,50,0.95)"/></marker>
            <marker id="ah-blue"   markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0,0 L0,5 L5,2.5 z" fill="rgba(60,140,255,0.95)"/></marker>
          </defs>
          <g id="highlight-layer"></g>
          <g id="arrow-layer"></g>
        </svg>
      </div>
    </div>
    <div class="player-label">
      <div class="player-avatar avatar-white" id="white-avatar">
        <i class="bi bi-person-fill"></i>
      </div>
      <span id="white-player-name">{{ game.white_player }}</span>
    </div>

  </div>

  <div class="info-col">
    <div class="info-panel">
      <div class="notation-header">
        <p class="section-label"><i class="bi bi-list-ol"></i> Move Notation</p>
        <button class="flip-icon-btn" id="flipBtn"><i class="bi bi-shuffle"></i></button>
      </div>

      <div class="moves-row">
        <button class="mobile-nav-arrow" id="mobilePrevBtn" title="Previous"><i class="bi bi-chevron-left"></i></button>
        <div id="moves-list"></div>
        <button class="mobile-nav-arrow" id="mobileNextBtn" title="Next"><i class="bi bi-chevron-right"></i></button>
      </div>

      <div class="board-controls">
        <button class="ctrl-btn c-prev"  id="prevBtn"  title="Previous (←)"><i class="bi bi-arrow-left"></i></button>
        <button class="ctrl-btn c-next"  id="nextBtn"  title="Next (→)"><i class="bi bi-arrow-right"></i></button>
        <button class="ctrl-btn c-reset" id="resetBtn" title="Reset (R)"><i class="bi bi-skip-backward-fill"></i></button>
      </div>
    </div>

    <div class="info-panel">
      <p class="section-label">
        <i class="bi bi-chat-fill"></i>
        Comments — Move <span id="comment-move-number">0</span>
      </p>
      <div id="comments-list"></div>
    </div>

    <div class="info-panel">
      <p class="section-label"><i class="bi bi-pencil"></i> Add a Comment</p>
      <form id="commentForm" method="post" action="{% url 'add_comment' game.slug_link %}">
        {% csrf_token %}
        <label class="comment-form-label" for="id_comment">
          For move <span id="form-move-label">0</span>
        </label>
        <textarea name="comment" id="id_comment" rows="3"
          placeholder="Share your thoughts on this position…" required></textarea>
        <input type="hidden" name="move_number" id="hidden-move-number" value="0">
        <button type="submit" class="comment-submit-btn">
          <i class="bi bi-send me-1"></i> Post
        </button>
      </form>
    </div>

  </div>
</div>

<div class="notification-container" id="notification-container"></div>

<!-- ══ SCRIPT ═══════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ── Audio ─────────────────────────────────────────────────── */
  const moveSound    = document.getElementById('moveSound');
  const captureSound = document.getElementById('captureSound');
  const checkSound   = document.getElementById('checkSound');

  function safePlay(el) {
    if (!el) return;
    el.currentTime = 0;
    el.play().catch(() => {});
  }

  function playSoundForMove(move) {
    if (!move) return;
    if (move.flags && move.flags.includes('c')) safePlay(captureSound);
    else if (chess.in_check())                  safePlay(checkSound);
    else                                         safePlay(moveSound);
  }

  /* ── Chess.js ──────────────────────────────────────────────── */
  const chess = new Chess();
  const pgn   = `{{ game.pgn|escapejs }}`;
  try { chess.load_pgn(pgn); } catch (e) { console.error('PGN:', e); }

  const movesHistoryVerbose = chess.history({ verbose: true });
  const movesHistory        = chess.history({ verbose: true });

  let moveIndex       = 0;
  let orientation     = 'white';
  let currentMoveNumber = 0;
  let lastOpeningName = 'Initial Position';
  let lastScore       = null;

  const commentsData = {{ comments_json|safe }};
  let board          = null;
  let fenOpenings    = {};

  fetch("{% static 'openings/openings.json' %}")
    .then(r => r.json()).then(d => { fenOpenings = d; }).catch(() => {});

  /* ── Player avatars ────────────────────────────────────────── */
  const FASTAPI_BASE = 'http://127.0.0.1:10000'; // must match where uvicorn is running

  const DEFAULT_AVATAR_ICON = '<i class="bi bi-person-fill"></i>';

  function setDefaultAvatar(avatarEl) {
    if (!avatarEl) return;
    avatarEl.innerHTML = DEFAULT_AVATAR_ICON;
  }

  function setAvatarImage(avatarEl, url) {
    if (!avatarEl) return;
    var img = document.createElement('img');
    img.alt = '';
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:6px;';
    img.onerror = function () {
      console.warn('[avatar] image failed to load:', url);
      setDefaultAvatar(avatarEl);
    };
    img.src = url;
    avatarEl.innerHTML = '';
    avatarEl.appendChild(img);
  }

  function applyPlayerThumb(avatarEl, name) {
    if (!avatarEl) { console.warn('[avatar] avatar element not found in DOM'); return; }
    if (!name || !name.trim()) { setDefaultAvatar(avatarEl); return; }

    var apiUrl = FASTAPI_BASE + '/players/by-name?name=' + encodeURIComponent(name);

    fetch(apiUrl)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (res) {
        if (res.ok && res.data && res.data.thumbUrl) {
          setAvatarImage(avatarEl, res.data.thumbUrl);
        } else {
          setDefaultAvatar(avatarEl);
        }
      })
      .catch(function (err) {
        console.error('[avatar] fetch failed for "' + name + '":', err);
        setDefaultAvatar(avatarEl);
      });
  }

  /* ── Notifications ─────────────────────────────────────────── */
  function showNotification(title, message, type, duration) {
    duration = duration || 2500;
    const c  = document.getElementById('notification-container');
    const el = document.createElement('div');
    el.className = 'notification ' + type;
    el.innerHTML =
      '<div class="notification-header">' +
        '<span class="notification-title">' + title + '</span>' +
        '<button class="notification-close">×</button>' +
      '</div>' +
      '<div class="notification-body">' + message + '</div>' +
      '<div class="notification-progress-bar" style="animation-duration:' + duration + 'ms;"></div>';
    c.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    el.querySelector('.notification-close').addEventListener('click', () => hideNotif(el));
    setTimeout(() => hideNotif(el), duration);
  }

  function hideNotif(el) {
    el.classList.remove('show');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
  }

  function showMessage(msg, type) {
    var titles = { success: 'Done', error: 'Error', warning: 'Warning', info: 'Info' };
    showNotification(titles[type] || 'Info', msg, type || 'info');
  }

  /* ── Move formatting ───────────────────────────────────────── */
  var blackSymbols = { p:'', n:'♘', b:'♗', r:'♖', q:'♕', k:'♔' };
  var whiteSymbols = { p:'', n:'♞', b:'♝', r:'♜', q:'♛', k:'♚' };

  function formatMove(move) {
    var color     = move.color || 'w';
    var piece     = move.piece || 'p';
    var to        = move.to   || '';
    var isCapture = move.flags && move.flags.includes('c');
    var symbols   = color === 'w' ? whiteSymbols : blackSymbols;
    var icon      = symbols[piece] || '';
    if (piece === 'p') return isCapture && move.san && move.san.length >= 4 ? move.san[0] + 'x' + to : to;
    return icon + (isCapture ? 'x' : '') + to;
  }

  /* ── Move list ─────────────────────────────────────────────── */
  function renderMovesList() {
    var div  = document.getElementById('moves-list');
    div.innerHTML = '';
    var frag = document.createDocumentFragment();

    var startSpan = document.createElement('span');
    startSpan.textContent      = 'Initial Position';
    startSpan.dataset.moveIndex = '0';
    startSpan.className        = 'initial-pos';
    startSpan.addEventListener('click', function () {
      moveIndex = 0; currentMoveNumber = 0; updateBoard(); renderComments();
    });
    frag.appendChild(startSpan);

    var counter = 1;
    for (var i = 0; i < movesHistoryVerbose.length; i += 2) {
      var row = document.createElement('div');
      row.className = 'move-pair-row';

      var num = document.createElement('span');
      num.className   = 'move-num';
      num.textContent = counter + '.';
      row.appendChild(num);

      (function (idx) {
        var wSpan = document.createElement('span');
        wSpan.className        = 'move-icon';
        wSpan.dataset.moveIndex = idx + 1;
        wSpan.innerHTML        = formatMove(movesHistoryVerbose[idx]);
        wSpan.addEventListener('click', function () {
          moveIndex = idx + 1; currentMoveNumber = moveIndex; updateBoard(); renderComments();
        });
        row.appendChild(wSpan);

        if (idx + 1 < movesHistoryVerbose.length) {
          var bSpan = document.createElement('span');
          bSpan.className        = 'move-icon';
          bSpan.dataset.moveIndex = idx + 2;
          bSpan.innerHTML        = formatMove(movesHistoryVerbose[idx + 1]);
          bSpan.addEventListener('click', function () {
            moveIndex = idx + 2; currentMoveNumber = moveIndex; updateBoard(); renderComments();
          });
          row.appendChild(bSpan);
        }
      })(i);

      frag.appendChild(row);
      counter++;
    }
    div.appendChild(frag);
  }

  function highlightMove() {
    document.querySelectorAll('.move-icon, .initial-pos').forEach(function (s) {
      s.classList.remove('active-move');
    });
    var cur = document.querySelector('[data-move-index="' + moveIndex + '"]');
    if (cur) {
      cur.classList.add('active-move');
      cur.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }

  /* ── Board update ──────────────────────────────────────────── */
  function updateBoard() {
    chess.reset();
    for (var i = 0; i < moveIndex; i++) {
      try { chess.move(movesHistory[i]); } catch (e) {}
    }

    if (board) {
      board.position(chess.fen(), false);
    }
    highlightMove();

    document.getElementById('comment-move-number').textContent = currentMoveNumber;
    document.getElementById('form-move-label').textContent     = currentMoveNumber;
    document.getElementById('hidden-move-number').value        = currentMoveNumber;

    analyzeWithStockfish();

    var fen0     = chess.fen().split(' ')[0];
    var initSpan = document.querySelector('span[data-move-index="0"]');
    if (initSpan) {
      if (moveIndex === 0)        lastOpeningName = 'Initial Position';
      else if (fenOpenings[fen0]) lastOpeningName = fenOpenings[fen0];
      initSpan.textContent = lastOpeningName;
    }
  }

  /* ── Comments ──────────────────────────────────────────────── */
  function renderComments() {
    var div      = document.getElementById('comments-list');
    div.innerHTML = '';
    var filtered = commentsData.filter(function (c) { return c.move_number == currentMoveNumber; });
    if (!filtered.length) {
      div.innerHTML = '<p class="no-comments">No comments for this position yet.</p>';
      return;
    }
    var frag = document.createDocumentFragment();
    filtered.forEach(function (c) {
      var item      = document.createElement('div');
      item.className = 'comment-item';
      var tag       = c.move_number === 0 ? 'Opening' : 'Move ' + c.move_number;
      item.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">' +
          '<span class="comment-user">' + c.user__username + '</span>' +
          '<span class="comment-move-tag">' + tag + '</span>' +
        '</div>' +
        '<p class="comment-text">' + c.comment + '</p>';
      frag.appendChild(item);
    });
    div.appendChild(frag);
    div.scrollTop = div.scrollHeight;
  }

  /* ── Stockfish ─────────────────────────────────────────────── */
  var engineTimeout = null, isAnalyzing = false;

  function analyzeWithStockfish() {
    if (engineTimeout) clearTimeout(engineTimeout);
    if (isAnalyzing) return;
    engineTimeout = setTimeout(function () {
      isAnalyzing = true;
      fetch('/analyze/', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body:    JSON.stringify({ fen: chess.fen() })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data.error && data.evaluation) {
            updateEvaluationBar(data.evaluation);
            updateBestMoveInList(currentMoveNumber, data.best_move_san);
          }
        })
        .catch(function () {})
        .finally(function () { isAnalyzing = false; });
    }, 500);
  }

  function updateEvaluationBar(evaluation) {
    var whiteBar = document.getElementById('white-bar');
    var blackBar = document.getElementById('black-bar');
    if (!whiteBar || !blackBar || !evaluation) return;

    var MAX = 10, score = 0;
    var isWhiteTurn = chess.turn() === 'w';

    if (evaluation.type === 'mate') {
      var m = Math.abs(evaluation.value);
      score = (evaluation.value > 0) ? (isWhiteTurn ? MAX : -MAX) : (isWhiteTurn ? -MAX : MAX);
      var mt = 'M' + m;
      var wp2 = 50 + (score / MAX) * 50;
      whiteBar.style.height = wp2 + '%'; blackBar.style.height = (100 - wp2) + '%';
      whiteBar.textContent = score > 0 ? mt : '';
      blackBar.textContent = score < 0 ? mt : '';
    } else if (evaluation.type === 'cp') {
      score = evaluation.value / 100;
      if (!isWhiteTurn) score = -score;
      score = Math.max(-MAX, Math.min(MAX, score));
      if (score === lastScore) return;
      lastScore = score;
      var txt = Math.abs(score) < 0.05 ? '' : Math.abs(score).toFixed(1);
      var wp3 = 50 + (score / MAX) * 50;
      whiteBar.style.height = wp3 + '%'; blackBar.style.height = (100 - wp3) + '%';
      whiteBar.textContent = score >  0.05 ? txt : '';
      blackBar.textContent = score < -0.05 ? txt : '';
    }
  }

  var revW = {}, revB = {};
  Object.keys(whiteSymbols).forEach(function (k) { var v = whiteSymbols[k]; if (v) revW[v] = k.toUpperCase(); });
  Object.keys(blackSymbols).forEach(function (k) { var v = blackSymbols[k]; if (v) revB[v] = k.toUpperCase(); });

  function symToLetter(s) {
    var f = s[0];
    return revW[f] ? revW[f] + s.slice(1) : revB[f] ? revB[f] + s.slice(1) : s;
  }

  function updateBestMoveInList(mi, bestMove) {
    if (mi < 2 || !bestMove) return;
    var span = document.querySelector('[data-move-index="' + (mi + 1) + '"]');
    if (!span || span.innerText.includes('→')) return;
    if (bestMove === symToLetter(span.innerHTML)) return;
    var hint = document.createElement('span');
    hint.style.cssText = 'opacity:0.42;font-size:0.76em;margin-left:4px;';
    hint.textContent   = '→ ' + bestMove;
    span.appendChild(hint);
  }

  /* ── Navigation ────────────────────────────────────────────── */
  function handleNextMove(e) {
    if (e) e.preventDefault();
    if (moveIndex < movesHistory.length) {
      moveIndex++;
      currentMoveNumber = moveIndex;
      var moveObj = chess.move(movesHistory[moveIndex - 1]);
      playSoundForMove(moveObj);
      updateBoard();
      renderComments();
    }
  }

  function handlePrevMove(e) {
    if (e) e.preventDefault();
    if (moveIndex > 0) {
      var undoneMove = chess.undo();
      moveIndex--;
      currentMoveNumber = moveIndex;
      playSoundForMove(undoneMove);
      updateBoard();
      renderComments();
    }
  }

  /* ── Board sizing ──────────────────────────────────────────── */
  var EVAL_RESERVE = 40;

  function getBoardSize() {
    var sw = window.innerWidth;
    if (sw >= 1920) return 650 - EVAL_RESERVE;
    if (sw >= 1600) return 600 - EVAL_RESERVE;
    if (sw >= 1370) return 550 - EVAL_RESERVE;
    if (sw >= 1200) return 488 - EVAL_RESERVE;
    if (sw >= 992)  return 430 - EVAL_RESERVE;
    if (sw >= 768)  return 380 - EVAL_RESERVE;
    return Math.min(Math.floor(sw * 0.90), 320) - 30;
  }

  function applyBoardSize(sz) {
    var wrapper = document.getElementById('board-wrapper');
    if (wrapper) {
      wrapper.style.width  = sz + 'px';
      wrapper.style.height = sz + 'px';
    }
    if (board) board.resize(sz);
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      applyBoardSize(getBoardSize());
      drawOverlay();
    }, 80);
  });

  /* ══════════════════════════════════════════════════════════════
     ARROW & HIGHLIGHT SYSTEM
  ══════════════════════════════════════════════════════════════ */
  var arrows     = {};
  var highlights = {};
  var dragFrom   = null;
  var dragStart  = null;
  var dragMods   = {};

  var COLORS = {
    green:  { stroke: 'rgba(0,200,80,0.92)',   marker: 'url(#ah-green)',  fill: 'rgba(0,200,80,0.22)'  },
    orange: { stroke: 'rgba(255,165,0,0.92)',  marker: 'url(#ah-orange)', fill: 'rgba(255,165,0,0.22)' },
    red:    { stroke: 'rgba(220,50,50,0.92)',  marker: 'url(#ah-red)',    fill: 'rgba(220,50,50,0.22)' },
    blue:   { stroke: 'rgba(60,140,255,0.92)', marker: 'url(#ah-blue)',   fill: 'rgba(60,140,255,0.22)'}
  };

  function pickColor(mods) {
    if (mods.alt)   return COLORS.blue;
    if (mods.ctrl)  return COLORS.red;
    if (mods.shift) return COLORS.orange;
    return COLORS.green;
  }

  function getSqSize() {
    var tbl = document.querySelector('#game-board table');
    if (tbl && tbl.offsetWidth > 0) return tbl.offsetWidth / 8;
    var bd  = document.getElementById('game-board');
    return bd && bd.offsetWidth > 0 ? bd.offsetWidth / 8 : 0;
  }

  function sqCenter(sq) {
    var file = sq.charCodeAt(0) - 97;
    var rank = parseInt(sq[1]) - 1;
    var sz   = getSqSize();
    var col  = orientation === 'white' ? file   : 7 - file;
    var row  = orientation === 'white' ? 7-rank : rank;
    return { x: col * sz + sz / 2, y: row * sz + sz / 2 };
  }

  function pxToSq(px, py) {
    var sz = getSqSize();
    if (!sz) return null;
    var col = Math.floor(px / sz);
    var row = Math.floor(py / sz);
    if (col < 0 || col > 7 || row < 0 || row > 7) return null;
    var file = orientation === 'white' ? col   : 7 - col;
    var rank = orientation === 'white' ? 7-row : row;
    return String.fromCharCode(97 + file) + (rank + 1);
  }

  function boardXY(e) {
    var bd   = document.getElementById('game-board');
    if (!bd) return null;
    var rect = bd.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function drawOverlay() {
    var hlg  = document.getElementById('highlight-layer');
    var arwg = document.getElementById('arrow-layer');
    if (!hlg || !arwg) return;
    hlg.innerHTML  = '';
    arwg.innerHTML = '';

    var sz = getSqSize();
    if (!sz) return;

    Object.keys(highlights).forEach(function (sq) {
      var color = highlights[sq];
      var file  = sq.charCodeAt(0) - 97;
      var rank  = parseInt(sq[1]) - 1;
      var col   = orientation === 'white' ? file   : 7 - file;
      var row   = orientation === 'white' ? 7-rank : rank;
      var el    = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      el.setAttribute('x', col * sz);
      el.setAttribute('y', row * sz);
      el.setAttribute('width',  sz);
      el.setAttribute('height', sz);
      el.setAttribute('fill',         color.fill);
      el.setAttribute('stroke',       color.stroke);
      el.setAttribute('stroke-width', 2);
      el.setAttribute('rx', 3);
      hlg.appendChild(el);
    });

    Object.keys(arrows).forEach(function (key) {
      var a     = arrows[key];
      var from  = sqCenter(a.from);
      var to    = sqCenter(a.to);
      var color = a.color;
      var dx    = to.x - from.x, dy = to.y - from.y;
      var len   = Math.sqrt(dx*dx + dy*dy) || 1;
      var shrink = sz * 0.30;
      var ex    = to.x - (dx / len) * shrink;
      var ey    = to.y - (dy / len) * shrink;
      var sw    = sz * 0.14;

      var line  = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', from.x);
      line.setAttribute('y1', from.y);
      line.setAttribute('x2', ex);
      line.setAttribute('y2', ey);
      line.setAttribute('stroke',          color.stroke);
      line.setAttribute('stroke-width',    sw);
      line.setAttribute('stroke-linecap',  'round');
      line.setAttribute('marker-end',      color.marker);
      arwg.appendChild(line);
    });
  }

  function clearOverlay() {
    arrows     = {};
    highlights = {};
    drawOverlay();
  }

  /* ── DOM ready ─────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function () {

    var initSz = getBoardSize();
    applyBoardSize(initSz);

    board = Chessboard('game-board', {
      position:     'start',
      draggable:    false,
      showNotation: true,
      pieceTheme:   "{% static 'chessboardjs-1.0.0/img/chesspieces/wikipedia/' %}{piece}.png",
      dropOffBoard: 'snapback',
      width:        initSz
    });

    document.getElementById('nextBtn').addEventListener('click',  handleNextMove);
    document.getElementById('prevBtn').addEventListener('click',  handlePrevMove);
    document.getElementById('mobileNextBtn').addEventListener('click', handleNextMove);
    document.getElementById('mobilePrevBtn').addEventListener('click', handlePrevMove);

    document.getElementById('resetBtn').addEventListener('click', function (e) {
      e.preventDefault();
      moveIndex = 0; currentMoveNumber = 0;
      chess.reset();
      updateBoard(); renderComments();
      clearOverlay();
      showMessage('Reset to start', 'info');
    });

    document.getElementById('flipBtn').addEventListener('click', function (e) {
      e.preventDefault();
      orientation = orientation === 'white' ? 'black' : 'white';
      board.orientation(orientation);

      var wn = document.getElementById('white-player-name');
      var bn = document.getElementById('black-player-name');
      var tmpName = wn.textContent; wn.textContent = bn.textContent; bn.textContent = tmpName;

      var wa = document.getElementById('white-avatar');
      var ba = document.getElementById('black-avatar');
      var tmpHtml = wa.innerHTML; wa.innerHTML = ba.innerHTML; ba.innerHTML = tmpHtml;

      var evalTrack = document.getElementById('eval-track');
      if (evalTrack) evalTrack.classList.toggle('flipped', orientation === 'black');

      showMessage('Flipped to ' + orientation, 'info');
      drawOverlay();
    });

    /* 3.5 ── Load player avatar thumbnails (this is what was missing) ── */
    applyPlayerThumb(document.getElementById('white-avatar'), '{{ game.white_player|escapejs }}');
    applyPlayerThumb(document.getElementById('black-avatar'), '{{ game.black_player|escapejs }}');

    document.addEventListener('keydown', function (e) {
      if (['INPUT','TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable) return;
      switch (e.key) {
        case 'ArrowRight': case ' ': e.preventDefault(); handleNextMove(); clearOverlay(); break;
        case 'ArrowLeft':            e.preventDefault(); handlePrevMove(); clearOverlay(); break;
        case 'r': case 'R':          e.preventDefault(); document.getElementById('resetBtn').click(); break;
        case 'f': case 'F':          e.preventDefault(); document.getElementById('flipBtn').click(); break;
        case 'Home':                 e.preventDefault(); document.getElementById('resetBtn').click(); break;
        case 'Escape':               clearOverlay(); break;
      }
    });

    document.getElementById('commentForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var form = e.target;
      var data = new FormData(form);
      data.set('move_number', currentMoveNumber);
      fetch(form.action, {
        method:  'POST',
        body:    data,
        headers: { 'X-CSRFToken': data.get('csrfmiddlewaretoken'), 'X-Requested-With': 'XMLHttpRequest' }
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.status === 'success') {
            commentsData.push({ user__username: res.username, move_number: res.move_number, comment: res.comment });
            renderComments(); form.reset();
            showMessage('Comment added!', 'success');
          } else {
            showMessage('Error: ' + (res.errors || 'Unknown'), 'error');
          }
        })
        .catch(function () { showMessage('Network error', 'error'); });
    });

    var boardDiv = document.getElementById('game-board');

    boardDiv.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);

    boardDiv.addEventListener('mousedown', function (e) {
      if (e.button !== 2) return;
      e.preventDefault();
      var pos = boardXY(e);
      if (!pos) return;
      dragFrom  = pxToSq(pos.x, pos.y);
      dragStart = pos;
      dragMods  = { shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey };
    });

    boardDiv.addEventListener('mouseup', function (e) {
      if (e.button !== 2) return;
      e.preventDefault();
      if (!dragFrom) return;
      var pos  = boardXY(e);
      if (!pos) { dragFrom = null; return; }
      var toSq = pxToSq(pos.x, pos.y);
      var dx   = pos.x - dragStart.x;
      var dy   = pos.y - dragStart.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var color = pickColor(dragMods);

      if (dist < 8 || toSq === dragFrom) {
        var hkey = dragFrom;
        if (highlights[hkey]) { delete highlights[hkey]; }
        else                  { highlights[hkey] = color; }
      } else if (toSq) {
        var akey = dragFrom + '-' + toSq;
        if (arrows[akey]) { delete arrows[akey]; }
        else              { arrows[akey] = { from: dragFrom, to: toSq, color: color }; }
      }

      dragFrom = null;
      drawOverlay();
    });

    boardDiv.addEventListener('click', function (e) {
      if (e.button === 0) clearOverlay();
    });

    renderMovesList();
    moveIndex = 1; currentMoveNumber = 1;
    updateBoard();
    renderComments();

    setTimeout(drawOverlay, 150);
  });

})();
</script>
