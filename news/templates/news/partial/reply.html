<!-- news/partial/reply.html -->
<div class="reply-item" id="reply-{{ reply.id }}" data-reply-id="{{ reply.id }}">

  <div class="comment-top">
    <div class="c-avatar" style="width:28px;height:28px;font-size:0.72rem;">
      {{ reply.user.username|first|upper }}
    </div>
    <div>
      <span class="c-username">{{ reply.user.username }}</span>
      <span class="c-time">· {{ reply.created_at|timesince }} ago</span>
    </div>
    {% if user == reply.user %}
    <div class="c-actions">
      <button class="c-action-btn delete-reply" data-reply-id="{{ reply.id }}">
        <i class="bi bi-trash-fill"></i>
      </button>
    </div>
    {% endif %}
  </div>

  <p class="reply-text" id="reply-content-{{ reply.id }}">{{ reply.content }}</p>

</div>
