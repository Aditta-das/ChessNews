<!-- news/partial/reply.html -->
<div class="reply-card mb-3" id="reply-{{ reply.id }}" data-reply-id="{{ reply.id }}" style="background: rgba(0, 0, 0, 0.2); border-radius: 12px; padding: 15px;">
    <div class="reply-header d-flex align-items-center mb-2">
        <div class="reply-avatar me-2">
            <div class="avatar-circle" style="width: 30px; height: 30px; background: linear-gradient(135deg, #1aa37b, #0d7a5a); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <span class="text-white" style="font-weight: 600; font-size: 0.8rem;">{{ reply.user.username|first|upper }}</span>
            </div>
        </div>
        <div class="reply-meta">
            <span class="text-white fw-bold me-2" style="font-size: 0.9rem;">{{ reply.user.username }}</span>
            <small class="text-muted">
                <i class="bi bi-clock" style="color: #1aa37b; font-size: 0.7rem;"></i>
                {{ reply.created_at|timesince }} ago
            </small>
        </div>
        
        <!-- Reply Actions -->
        <div class="reply-actions ms-auto">
            {% if user == reply.user %}
            <button class="btn btn-sm btn-link delete-reply" data-reply-id="{{ reply.id }}" style="color: #dc3545; padding: 2px 5px;">
                <i class="bi bi-trash-fill" style="font-size: 0.8rem;"></i>
            </button>
            {% endif %}
        </div>
    </div>
    
    <div class="reply-content" id="reply-content-{{ reply.id }}">
        <p class="mb-0" style="color: #ccc; font-size: 0.95rem; line-height: 1.5;">{{ reply.content }}</p>
    </div>
</div>
